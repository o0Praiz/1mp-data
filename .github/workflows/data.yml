# Builds the public data libraries each day and publishes them to
# Hugging Face. All logic is in run.py and engines/library/build.py.
# Needs one Actions secret: HF_TOKEN (write access to the two datasets).
name: data
on:
  schedule:
    - cron: "23 10 * * *"   # each day, 10:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engines/library/**'
      - 'libraries/**'
      - 'run.py'
      - '.github/workflows/data.yml'
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -q -r requirements.txt pytest
      - name: tests
        run: python -m pytest -q engines/library/tests
      - name: build and publish
        # A push only tests; the schedule and a manual run build.
        if: ${{ github.event_name != 'push' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python run.py
      - name: commit the manifests
        if: ${{ github.event_name != 'push' && !cancelled() }}
        run: |
          git config user.name "1mp-data-workflow"
          git config user.email "actions@users.noreply.github.com"
          git add engines/apify/data 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: workflow run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
